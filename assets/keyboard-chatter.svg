<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#12162b"/>
      <stop offset="100%" stop-color="#05060b"/>
    </radialGradient>
    
    <!-- Neon Cyan -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Neon Pink -->
    <linearGradient id="neon-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#aa00ff"/>
    </linearGradient>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- Waveform Analysis Grids -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1" fill="none">
    <path d="M 50,150 L 750,150 M 50,200 L 750,200 M 50,250 L 750,250 M 50,300 L 750,300" />
    <path d="M 100,100 L 100,350 M 200,100 L 200,350 M 300,100 L 300,350 M 400,100 L 400,350 M 500,100 L 500,350 M 600,100 L 600,350 M 700,100 L 700,350" />
  </g>

  <!-- Clean Keystroke (Left Side) -->
  <g transform="translate(10, 0)">
    <text x="200" y="120" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#fff">CLEAN SIGNAL (1 CLICK)</text>
    <!-- Waveform line -->
    <path d="M 80,250 L 160,250 L 160,180 L 280,180 L 280,250 L 340,250" fill="none" stroke="url(#neon-cyan)" stroke-width="4" filter="url(#glow-cyan)" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="160" cy="180" r="6" fill="#fff" filter="url(#glow-cyan)"/>
    <circle cx="280" cy="250" r="6" fill="#fff" filter="url(#glow-cyan)"/>
  </g>

  <!-- Chattering Keystroke (Right Side) -->
  <g transform="translate(380, 0)">
    <text x="220" y="120" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#ff007f">CHATTER SIGNAL (BOUNCING)</text>
    <!-- Waveform line with bouncing chatter -->
    <path d="M 80,250 L 130,250 L 130,180 L 150,180 L 150,250 L 170,250 L 170,180 L 195,180 L 195,250 L 210,250 L 210,180 L 280,180 L 280,250 L 340,250" fill="none" stroke="url(#neon-pink)" stroke-width="4" filter="url(#glow-pink)" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bouncing indicators -->
    <circle cx="130" cy="180" r="4" fill="#fff"/>
    <circle cx="150" cy="250" r="4" fill="#fff"/>
    <circle cx="170" cy="180" r="4" fill="#fff"/>
    <circle cx="195" cy="250" r="4" fill="#fff"/>
    <circle cx="210" cy="180" r="4" fill="#fff"/>
  </g>

  <!-- Diagnostic Title Overlay -->
  <text x="400" y="380" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="22" font-weight="700" fill="#fff">
    UNDERSTANDING KEYBOARD CHATTER
  </text>
  <text x="400" y="405" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="12" font-weight="500" fill="url(#neon-cyan)" letter-spacing="1">
    BOUNCING CONTACTS VS CLEAN STABLE REGISTERING
  </text>
</svg>
