<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#12162b"/>
      <stop offset="100%" stop-color="#05060b"/>
    </radialGradient>
    
    <!-- Neon Pink -->
    <linearGradient id="neon-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#aa00ff"/>
    </linearGradient>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Neon Cyan -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- Left: ABS Keycap -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="220" height="180" rx="16" fill="#1b1d2e" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2"/>
    <!-- ABS Keycap Drawing -->
    <path d="M 40,40 L 180,40 L 200,120 L 20,120 Z" fill="url(#neon-pink)" filter="url(#glow-pink)"/>
    <!-- Shiny highlights (reflective grease) -->
    <path d="M 50,50 L 170,50 L 180,90 L 40,90 Z" fill="rgba(255, 255, 255, 0.25)"/>
    <text x="110" y="85" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#0d0e15">ABS</text>
    
    <text x="110" y="150" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#ff007f">SHINY &amp; THIN</text>
    <text x="110" y="165" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">Smooth, prone to grease</text>
  </g>

  <!-- Right: PBT Keycap -->
  <g transform="translate(480, 100)">
    <rect x="0" y="0" width="220" height="180" rx="16" fill="#1b1d2e" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2"/>
    <!-- PBT Keycap Drawing -->
    <path d="M 40,40 L 180,40 L 200,120 L 20,120 Z" fill="url(#neon-cyan)" filter="url(#glow-cyan)"/>
    <!-- Textured matte overlays -->
    <path d="M 50,50 L 170,50 L 180,90 L 40,90 Z" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="3" stroke-dasharray="2,2"/>
    <text x="110" y="85" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#0d0e15">PBT</text>
    
    <text x="110" y="150" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="url(#neon-cyan)">MATTE &amp; DURABLE</text>
    <text x="110" y="165" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">Textured, no shining wear</text>
  </g>

  <!-- Main Title -->
  <text x="400" y="340" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="24" font-weight="700" fill="#fff" letter-spacing="1">
    ABS VS PBT KEYCAPS
  </text>
  <text x="400" y="365" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="12" font-weight="500" fill="url(#neon-cyan)" letter-spacing="0.5">
    DURABILITY, TEXTURE, AND SOUND SIGNATURES COMPARED
  </text>
</svg>
