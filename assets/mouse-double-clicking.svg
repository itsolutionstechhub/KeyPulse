<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#12162b"/>
      <stop offset="100%" stop-color="#05060b"/>
    </radialGradient>
    
    <!-- Neon Cyan -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- Microswitch illustration -->
  <g transform="translate(180, 80)">
    <!-- Switch Box Case -->
    <rect x="0" y="0" width="440" height="200" rx="16" fill="rgba(18, 22, 41, 0.8)" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
    
    <!-- Plunger button (Red) -->
    <rect x="50" y="-15" width="40" height="30" rx="4" fill="#ff007f"/>
    <rect x="45" y="15" width="50" height="6" fill="#aa00ff"/>
    
    <!-- Internal Copper Tension Spring Plate -->
    <path d="M 60,80 L 320,80 Q 360,80 380,105" fill="none" stroke="#fff" stroke-width="4"/>
    <!-- Tension curved leaf -->
    <path d="M 60,80 Q 200,120 280,140" fill="none" stroke="#ae7a52" stroke-width="3"/>
    
    <!-- Contacts -->
    <!-- Stationary contact top -->
    <circle cx="380" cy="50" r="10" fill="rgba(255,255,255,0.2)"/>
    <!-- Stationary contact bottom (active) -->
    <circle cx="380" cy="140" r="10" fill="url(#neon-cyan)" filter="url(#glow-cyan)"/>
    
    <!-- Moving contact on spring -->
    <circle cx="380" cy="105" r="8" fill="#ff007f"/>
    <!-- Double-click bounce arrows -->
    <path d="M 380,85 L 380,65" fill="none" stroke="#ff007f" stroke-width="2" stroke-dasharray="3,3"/>
    <path d="M 380,125 L 380,145" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="3,3"/>
  </g>

  <!-- Main Title -->
  <text x="400" y="340" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="22" font-weight="700" fill="#fff" letter-spacing="1">
    FIX MOUSE DOUBLE CLICK ISSUES
  </text>
  <text x="400" y="365" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="12" font-weight="500" fill="url(#neon-cyan)" letter-spacing="0.5">
    DIAGNOSING TENSION SPRINGS &amp; CONTACT OXIDATION IN MICROSWITCHES
  </text>
</svg>
