<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#12162b"/>
      <stop offset="100%" stop-color="#05060b"/>
    </radialGradient>
    
    <!-- Neon Pink -->
    <linearGradient id="neon-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#aa00ff"/>
    </linearGradient>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Neon Cyan -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- Left: Wrong mapping path -->
  <g transform="translate(120, 100)">
    <!-- Virtual Keycap Pressed -->
    <rect x="0" y="40" width="60" height="50" rx="8" fill="url(#neon-pink)" stroke="#fff" stroke-width="2" filter="url(#glow-pink)"/>
    <text x="30" y="72" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="22" fill="#0d0e15">Y</text>
    
    <!-- Mapping arrow -->
    <path d="M 80,65 L 140,65" stroke="#ff007f" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 130,55 L 145,65 L 130,75" fill="#ff007f"/>
    
    <!-- Wrong Character Registered -->
    <rect x="170" y="40" width="60" height="50" rx="8" fill="#1b1d2e" stroke="red" stroke-width="2"/>
    <text x="200" y="72" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="22" fill="red">Z</text>
    <text x="115" y="120" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Wrong Keyboard Layout Mapping</text>
  </g>

  <!-- Right: Windows Language Bar UI -->
  <g transform="translate(460, 90)" filter="url(#glow-cyan)">
    <!-- Taskbar language popup -->
    <rect x="0" y="0" width="220" height="150" rx="12" fill="#0a0c16" stroke="url(#neon-cyan)" stroke-width="2"/>
    <!-- Active Layout option -->
    <rect x="10" y="20" width="200" height="50" rx="8" fill="rgba(0, 240, 255, 0.1)" stroke="url(#neon-cyan)" stroke-width="1"/>
    <text x="25" y="42" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#fff">ENG</text>
    <text x="65" y="40" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#fff">US Keyboard</text>
    <text x="65" y="55" font-family="'Outfit', sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">QWERTY layout settings</text>

    <!-- Alternative Layout option -->
    <rect x="10" y="80" width="200" height="50" rx="8" fill="#1b1d2e"/>
    <text x="25" y="102" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="rgba(255,255,255,0.4)">ENG</text>
    <text x="65" y="100" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,0.4)">United Kingdom</text>
    <text x="65" y="115" font-family="'Outfit', sans-serif" font-size="9" fill="rgba(255,255,255,0.2)">@ and " keys swapped</text>
  </g>

  <!-- Main Title -->
  <text x="400" y="340" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="22" font-weight="700" fill="#fff" letter-spacing="1">
    FIX TYPING WRONG LETTERS
  </text>
  <text x="400" y="365" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="12" font-weight="500" fill="url(#neon-cyan)" letter-spacing="0.5">
    RESOLVING QWERTY LAYOUTS &amp; WINDOWS INPUT GLITCHES
  </text>
</svg>
