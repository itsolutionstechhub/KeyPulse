<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#12162b"/>
      <stop offset="100%" stop-color="#05060b"/>
    </radialGradient>
    
    <!-- Neon Pink -->
    <linearGradient id="neon-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#aa00ff"/>
    </linearGradient>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- Left: A metal spring vibrating -->
  <g transform="translate(180, 80)">
    <!-- Switch housing outline -->
    <rect x="-40" y="0" width="160" height="200" rx="12" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
    <!-- Switch Spring -->
    <path d="M 40,20 Q 20,40 40,60 Q 60,80 40,100 Q 20,120 40,140 Q 60,160 40,180" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <!-- Spring vibration lines -->
    <path d="M -15,100 A 30,30 0 0,0 -15,130" fill="none" stroke="url(#neon-pink)" stroke-width="3" filter="url(#glow-pink)" stroke-linecap="round"/>
    <path d="M -25,90 A 45,45 0 0,0 -25,140" fill="none" stroke="url(#neon-pink)" stroke-width="3" filter="url(#glow-pink)" stroke-linecap="round"/>
    
    <path d="M 95,100 A 30,30 0 0,1 95,130" fill="none" stroke="url(#neon-pink)" stroke-width="3" filter="url(#glow-pink)" stroke-linecap="round"/>
    <path d="M 105,90 A 45,45 0 0,1 105,140" fill="none" stroke="url(#neon-pink)" stroke-width="3" filter="url(#glow-pink)" stroke-linecap="round"/>
  </g>

  <!-- Right: Lube tub / switch dampening graphic -->
  <g transform="translate(480, 100)">
    <!-- Dampener tub -->
    <rect x="0" y="40" width="140" height="110" rx="10" fill="#1b1d2e" stroke="#00f0ff" stroke-width="3"/>
    <rect x="-10" y="20" width="160" height="25" rx="6" fill="#00f0ff"/>
    <text x="70" y="37" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="10" font-weight="900" fill="#0d0e15">G-LUBE 205G0</text>
    
    <!-- Lube brush dipping -->
    <path d="M 100,-20 L 70,60" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <path d="M 67,50 L 73,65" stroke="#ff007f" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Main Title -->
  <text x="400" y="340" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="22" font-weight="700" fill="#fff" letter-spacing="1">
    HOW TO FIX SWITCH SPRING PING
  </text>
  <text x="400" y="365" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="12" font-weight="500" fill="#ff007f" letter-spacing="0.5">
    DAMPENING METALLIC RESONANCE WITH SWITCH LUBRICATION
  </text>
</svg>
