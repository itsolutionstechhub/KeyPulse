<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#12162b"/>
      <stop offset="100%" stop-color="#05060b"/>
    </radialGradient>
    
    <!-- Neon Pink -->
    <linearGradient id="neon-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#aa00ff"/>
    </linearGradient>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Neon Cyan -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- Left Side: Shift Key icon (5 times press concept) -->
  <g transform="translate(100, 100)" filter="url(#glow-pink)">
    <!-- Main Shift Key shape -->
    <rect x="0" y="40" width="220" height="120" rx="16" fill="url(#neon-pink)" stroke="#fff" stroke-width="3"/>
    
    <!-- Shift arrow vector -->
    <path d="M 110,65 L 140,95 L 125,95 L 125,125 L 95,125 L 95,95 L 80,95 Z" fill="#0d0e15"/>
    <text x="110" y="150" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="900" font-size="14" fill="#0d0e15">SHIFT KEY</text>
    
    <!-- Multiplier Badge (5X) -->
    <circle cx="210" cy="40" r="30" fill="#05060b" stroke="#ff007f" stroke-width="3"/>
    <text x="210" y="48" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" fill="#ff007f">5X</text>
  </g>

  <!-- Right Side: Windows Dialog Popup simulator -->
  <g transform="translate(420, 80)" filter="url(#glow-cyan)">
    <!-- Dialog Box Frame -->
    <rect x="0" y="0" width="280" height="180" rx="12" fill="#0a0c16" stroke="url(#neon-cyan)" stroke-width="2"/>
    <!-- Titlebar -->
    <rect x="0" y="0" width="280" height="30" rx="12" fill="#1b1d2e"/>
    <rect x="0" y="15" width="280" height="15" fill="#1b1d2e"/> <!-- flatten bottom rounded corners of titlebar -->
    <text x="15" y="20" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#fff">Sticky Keys</text>
    <circle cx="265" cy="15" r="6" fill="#ff007f"/> <!-- Close button -->

    <!-- Dialog Text content -->
    <text x="15" y="60" font-family="'Outfit', sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">Do you want to turn on Sticky Keys?</text>
    <text x="15" y="80" font-family="'Outfit', sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">Sticky Keys lets you use Shift, Ctrl, Alt,</text>
    <text x="15" y="95" font-family="'Outfit', sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">or Windows keys by pressing one key at a time.</text>

    <!-- Buttons -->
    <rect x="130" y="130" width="60" height="28" rx="6" fill="url(#neon-cyan)" stroke="#fff" stroke-width="1"/>
    <text x="160" y="148" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#0d0e15">Yes</text>

    <rect x="205" y="130" width="60" height="28" rx="6" fill="#1b1d2e" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="235" y="148" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#fff">No</text>

    <!-- Shortcut setting link -->
    <text x="15" y="120" font-family="'Outfit', sans-serif" font-size="9" fill="url(#neon-cyan)" text-decoration="underline">Disable this keyboard shortcut</text>
  </g>

  <!-- Main Title -->
  <text x="400" y="380" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="24" font-weight="700" fill="#fff" letter-spacing="1">
    HOW TO FIX STICKY KEYS POPUP
  </text>
  <text x="400" y="405" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="12" font-weight="500" fill="url(#neon-cyan)" letter-spacing="0.5">
    DISABLE ACCESSIBILITY GLITCHES ON WINDOWS 10/11
  </text>
</svg>
