<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#12162b"/>
      <stop offset="100%" stop-color="#05060b"/>
    </radialGradient>
    
    <!-- Neon Cyan (NKRO Active) -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Neon Pink (Anti-Ghosting active) -->
    <linearGradient id="neon-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#aa00ff"/>
    </linearGradient>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- Key Matrix Grid (Pressed keys glowing, inactive ones dimmed) -->
  <g transform="translate(100, 80)">
    <!-- Row 1 -->
    <rect x="20" y="20" width="60" height="50" rx="8" fill="#1b1d2e" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
    <rect x="90" y="20" width="60" height="50" rx="8" fill="#1b1d2e" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
    <!-- Active Key: W -->
    <rect x="160" y="20" width="60" height="50" rx="8" fill="url(#neon-cyan)" stroke="#fff" stroke-width="2" filter="url(#glow-cyan)"/>
    <text x="190" y="52" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="20" fill="#0d0e15">W</text>
    
    <rect x="230" y="20" width="60" height="50" rx="8" fill="#1b1d2e" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
    <rect x="300" y="20" width="60" height="50" rx="8" fill="#1b1d2e" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>

    <!-- Row 2 -->
    <!-- Active Key: A -->
    <rect x="10" y="80" width="60" height="50" rx="8" fill="url(#neon-cyan)" stroke="#fff" stroke-width="2" filter="url(#glow-cyan)"/>
    <text x="40" y="112" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="20" fill="#0d0e15">A</text>
    
    <!-- Active Key: S -->
    <rect x="80" y="80" width="60" height="50" rx="8" fill="url(#neon-cyan)" stroke="#fff" stroke-width="2" filter="url(#glow-cyan)"/>
    <text x="110" y="112" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="20" fill="#0d0e15">S</text>
    
    <!-- Active Key: D -->
    <rect x="150" y="80" width="60" height="50" rx="8" fill="url(#neon-cyan)" stroke="#fff" stroke-width="2" filter="url(#glow-cyan)"/>
    <text x="180" y="112" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="20" fill="#0d0e15">D</text>
    
    <rect x="220" y="80" width="60" height="50" rx="8" fill="#1b1d2e" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
    <rect x="290" y="80" width="60" height="50" rx="8" fill="#1b1d2e" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>

    <!-- Row 3 -->
    <!-- Active Key: Shift -->
    <rect x="0" y="140" width="90" height="50" rx="8" fill="url(#neon-pink)" stroke="#fff" stroke-width="2" filter="url(#glow-pink)"/>
    <text x="45" y="172" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="700" font-size="14" fill="#0d0e15">SHIFT</text>
    
    <rect x="100" y="140" width="60" height="50" rx="8" fill="#1b1d2e" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
    <rect x="170" y="140" width="60" height="50" rx="8" fill="#1b1d2e" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
    <rect x="240" y="140" width="60" height="50" rx="8" fill="#1b1d2e" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
    
    <!-- Active Key: Spacebar -->
    <rect x="80" y="200" width="220" height="50" rx="8" fill="url(#neon-cyan)" stroke="#fff" stroke-width="2" filter="url(#glow-cyan)"/>
    <text x="190" y="232" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="18" fill="#0d0e15">SPACEBAR</text>
  </g>

  <!-- NKRO Info Box (Right Side) -->
  <g transform="translate(480, 100)" filter="url(#glow-cyan)">
    <rect x="0" y="0" width="220" height="180" rx="16" fill="rgba(18, 22, 41, 0.8)" stroke="url(#neon-cyan)" stroke-width="3"/>
    <text x="110" y="40" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#fff">NKRO STATUS</text>
    <text x="110" y="90" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="36" font-weight="900" fill="url(#neon-cyan)">ACTIVE</text>
    <text x="110" y="130" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="12" fill="rgba(255,255,255,0.5)">6 KEYS PRESSED</text>
    <text x="110" y="150" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="12" fill="rgba(255,255,255,0.5)">0 GHOST KEYS</text>
  </g>

  <!-- Main Title -->
  <text x="400" y="380" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="24" font-weight="700" fill="#fff" letter-spacing="1">
    WHAT IS N-KEY ROLLOVER (NKRO)?
  </text>
  <text x="400" y="405" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="12" font-weight="500" fill="url(#neon-cyan)" letter-spacing="0.5">
    ANTI-GHOSTING TECHNOLOGY FOR COMPETITIVE GAMING
  </text>
</svg>
