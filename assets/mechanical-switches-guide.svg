<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#12162b"/>
      <stop offset="100%" stop-color="#05060b"/>
    </radialGradient>
    
    <!-- Neon Colors -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="24" font-weight="700" fill="#fff" letter-spacing="1">
    MECHANICAL KEYBOARD SWITCH GUIDE
  </text>
  <text x="400" y="75" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="12" font-weight="500" fill="#00f0ff" letter-spacing="0.5">
    RED • BLUE • BROWN • BLACK
  </text>

  <!-- Switch 1: RED (Linear) -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="140" height="220" rx="12" fill="#1b1d2e" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2"/>
    <!-- Switch stem -->
    <rect x="55" y="30" width="30" height="30" rx="4" fill="#ff2e2e"/>
    <rect x="67" y="20" width="6" height="50" rx="1" fill="#fff"/>
    <rect x="45" y="42" width="50" height="6" rx="1" fill="#fff"/>
    <!-- Switch Housing -->
    <path d="M 20,90 L 120,90 L 130,150 L 10,150 Z" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <text x="70" y="180" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#ff2e2e">RED</text>
    <text x="70" y="200" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Linear &amp; Silent</text>
  </g>

  <!-- Switch 2: BLUE (Clicky) -->
  <g transform="translate(240, 110)">
    <rect x="0" y="0" width="140" height="220" rx="12" fill="#1b1d2e" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2"/>
    <!-- Switch stem -->
    <rect x="55" y="30" width="30" height="30" rx="4" fill="#00c0ff" filter="url(#glow-cyan)"/>
    <rect x="67" y="20" width="6" height="50" rx="1" fill="#fff"/>
    <rect x="45" y="42" width="50" height="6" rx="1" fill="#fff"/>
    <!-- Switch Housing -->
    <path d="M 20,90 L 120,90 L 130,150 L 10,150 Z" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <text x="70" y="180" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#00c0ff">BLUE</text>
    <text x="70" y="200" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Tactile &amp; Clicky</text>
  </g>

  <!-- Switch 3: BROWN (Tactile) -->
  <g transform="translate(420, 110)">
    <rect x="0" y="0" width="140" height="220" rx="12" fill="#1b1d2e" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2"/>
    <!-- Switch stem -->
    <rect x="55" y="30" width="30" height="30" rx="4" fill="#8e5d38"/>
    <rect x="67" y="20" width="6" height="50" rx="1" fill="#fff"/>
    <rect x="45" y="42" width="50" height="6" rx="1" fill="#fff"/>
    <!-- Switch Housing -->
    <path d="M 20,90 L 120,90 L 130,150 L 10,150 Z" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <text x="70" y="180" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#ae7a52">BROWN</text>
    <text x="70" y="200" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Tactile &amp; Gentle</text>
  </g>

  <!-- Switch 4: BLACK (Heavy Linear) -->
  <g transform="translate(600, 110)">
    <rect x="0" y="0" width="140" height="220" rx="12" fill="#1b1d2e" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2"/>
    <!-- Switch stem -->
    <rect x="55" y="30" width="30" height="30" rx="4" fill="#222"/>
    <rect x="67" y="20" width="6" height="50" rx="1" fill="#fff"/>
    <rect x="45" y="42" width="50" height="6" rx="1" fill="#fff"/>
    <!-- Switch Housing -->
    <path d="M 20,90 L 120,90 L 130,150 L 10,150 Z" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <text x="70" y="180" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#fff">BLACK</text>
    <text x="70" y="200" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Heavy &amp; Linear</text>
  </g>
</svg>
