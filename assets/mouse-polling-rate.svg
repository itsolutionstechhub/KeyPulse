<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#12162b"/>
      <stop offset="100%" stop-color="#05060b"/>
    </radialGradient>
    
    <!-- Neon Pink -->
    <linearGradient id="neon-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#aa00ff"/>
    </linearGradient>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- Left Side: Mouse Vector -->
  <g transform="translate(180, 100)" filter="url(#glow-pink)">
    <path d="M 30,30 Q 30,0 60,0 Q 90,0 90,30 L 90,90 Q 90,120 60,120 Q 30,120 30,90 Z" fill="none" stroke="url(#neon-pink)" stroke-width="4"/>
    <!-- Mouse wheel -->
    <rect x="57" y="20" width="6" height="18" rx="3" fill="#fff"/>
    <!-- Click split line -->
    <line x1="60" y1="0" x2="60" y2="50" stroke="url(#neon-pink)" stroke-width="2"/>
    <text x="60" y="150" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Gaming Mouse</text>
  </g>

  <!-- Right Side: Frequency dial metrics -->
  <g transform="translate(420, 80)">
    <!-- Speed selector frame -->
    <rect x="0" y="0" width="220" height="170" rx="16" fill="#1b1d2e" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
    
    <!-- Polling rate speeds list -->
    <text x="30" y="40" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="rgba(255,255,255,0.3)">125 Hz (8ms delay)</text>
    <text x="30" y="70" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="rgba(255,255,255,0.3)">500 Hz (2ms delay)</text>
    
    <!-- Active: 1000 Hz -->
    <g filter="url(#glow-pink)">
      <rect x="15" y="90" width="190" height="35" rx="8" fill="rgba(255, 0, 127, 0.1)" stroke="#ff007f" stroke-width="1.5"/>
      <text x="30" y="112" font-family="'Outfit', sans-serif" font-size="15" font-weight="900" fill="#fff">1000 Hz (1ms delay)</text>
    </g>
    
    <text x="30" y="150" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="rgba(255,255,255,0.3)">8000 Hz (0.125ms delay)</text>
  </g>

  <!-- Main Title -->
  <text x="400" y="340" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="22" font-weight="700" fill="#fff" letter-spacing="1">
    CHECK MOUSE POLLING RATE (Hz)
  </text>
  <text x="400" y="365" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="12" font-weight="500" fill="url(#neon-pink)" letter-spacing="0.5">
    UNDERSTANDING HIGH REFRESH INPUT FOR GAMING SENSORS
  </text>
</svg>
