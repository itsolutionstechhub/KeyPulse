<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#12162b"/>
      <stop offset="100%" stop-color="#05060b"/>
    </radialGradient>
    
    <!-- Neon Cyan (Mechanical) -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Neon Pink (Membrane) -->
    <linearGradient id="neon-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#aa00ff"/>
    </linearGradient>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- Divider Line -->
  <line x1="400" y1="50" x2="400" y2="350" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Left Side: MECHANICAL SWITCH -->
  <g transform="translate(130, 60)">
    <!-- Glow Underneath -->
    <ellipse cx="120" cy="240" rx="90" ry="15" fill="rgba(0, 240, 255, 0.1)" filter="url(#glow-cyan)"/>
    
    <!-- Switch Body Housing (Bottom) -->
    <path d="M 40,180 L 200,180 L 220,230 L 20,230 Z" fill="#1b1d2e" stroke="url(#neon-cyan)" stroke-width="2"/>
    
    <!-- Metal Springs inside -->
    <path d="M 120,130 Q 140,140 120,150 Q 100,160 120,170 Q 140,180 120,190" fill="none" stroke="#8e95af" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Switch stem plunger (Blue Switch) -->
    <path d="M 90,80 L 150,80 L 150,130 L 120,140 L 90,130 Z" fill="url(#neon-cyan)" filter="url(#glow-cyan)"/>
    <!-- Stem cross head -->
    <rect x="105" y="50" width="30" height="30" rx="3" fill="#0080ff" stroke="#fff" stroke-width="1.5"/>
    <rect x="117" y="40" width="6" height="50" rx="2" fill="#fff"/>
    <rect x="95" y="62" width="50" height="6" rx="2" fill="#fff"/>
    
    <!-- Clear Upper Housing (Outlines) -->
    <path d="M 50,100 L 190,100 L 200,180 L 40,180 Z" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

    <!-- Labels -->
    <text x="120" y="270" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#fff">
      MECHANICAL
    </text>
    <text x="120" y="290" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="12" font-weight="500" fill="url(#neon-cyan)">
      TACTILE &amp; INDEPENDENT
    </text>
  </g>

  <!-- Right Side: MEMBRANE DOME -->
  <g transform="translate(470, 60)">
    <!-- Glow Underneath -->
    <ellipse cx="120" cy="240" rx="90" ry="15" fill="rgba(255, 0, 127, 0.1)" filter="url(#glow-pink)"/>
    
    <!-- PCB bottom layer -->
    <rect x="10" y="220" width="220" height="12" rx="4" fill="#0f1015" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <!-- Conductive traces -->
    <line x1="20" y1="220" x2="220" y2="220" stroke="#4a154b" stroke-width="3"/>
    <circle cx="120" cy="220" r="10" fill="url(#neon-pink)" filter="url(#glow-pink)"/>

    <!-- Rubber Dome shape -->
    <path d="M 30,220 Q 50,140 120,140 Q 190,140 210,220" fill="none" stroke="url(#neon-pink)" stroke-width="5" filter="url(#glow-pink)"/>
    <!-- Rubber Dome shaded fill -->
    <path d="M 30,220 Q 50,140 120,140 Q 190,140 210,220 Z" fill="rgba(255, 0, 127, 0.05)"/>

    <!-- Keycap on top of dome -->
    <path d="M 70,80 L 170,80 L 180,130 L 60,130 Z" fill="#1b1d2e" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <rect x="75" y="85" width="90" height="40" rx="4" fill="rgba(255,255,255,0.02)"/>
    <!-- Plunger pushing dome -->
    <rect x="110" y="130" width="20" height="30" fill="#1b1d2e" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

    <!-- Labels -->
    <text x="120" y="270" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#fff">
      MEMBRANE
    </text>
    <text x="120" y="290" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="12" font-weight="500" fill="url(#neon-pink)">
      SILENT RUBBER DOME
    </text>
  </g>

  <!-- VS Text Badge -->
  <circle cx="400" cy="200" r="28" fill="#0d0e15" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <text x="400" y="207" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#fff">
    VS
  </text>
</svg>
