<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#12162b"/>
      <stop offset="100%" stop-color="#05060b"/>
    </radialGradient>
    
    <!-- Neon Cyan -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- Left: Real keypress -->
  <g transform="translate(140, 100)">
    <rect x="0" y="30" width="70" height="60" rx="8" fill="#1b1d2e" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
    <text x="35" y="68" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="24" fill="#fff">A</text>
    <text x="35" y="110" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Physical Press</text>
  </g>

  <!-- Connection path with latency timing -->
  <g transform="translate(240, 100)" filter="url(#glow-cyan)">
    <!-- Pathway line -->
    <path d="M 0,60 L 220,60" stroke="url(#neon-cyan)" stroke-width="4" stroke-dasharray="8,4" stroke-linecap="round"/>
    <circle cx="110" cy="60" r="28" fill="#05060b" stroke="url(#neon-cyan)" stroke-width="2"/>
    <text x="110" y="64" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="900" fill="#fff">1.2ms</text>
    <text x="110" y="105" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="11" fill="url(#neon-cyan)">LATENCY</text>
  </g>

  <!-- Right: Registered on monitor -->
  <g transform="translate(490, 80)">
    <!-- Monitor frame -->
    <rect x="0" y="0" width="160" height="110" rx="10" fill="#0d0e15" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <rect x="0" y="15" width="160" height="80" fill="#000"/>
    <rect x="60" y="110" width="40" height="30" fill="rgba(255,255,255,0.1)"/>
    <rect x="40" y="135" width="80" height="8" rx="2" fill="rgba(255,255,255,0.1)"/>
    
    <!-- Rendered text -->
    <text x="80" y="65" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="900" fill="url(#neon-cyan)" filter="url(#glow-cyan)">A</text>
    <text x="80" y="160" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="11" fill="rgba(255,255,255,0.4)">Registered Input</text>
  </g>

  <!-- Main Title -->
  <text x="400" y="340" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="22" font-weight="700" fill="#fff" letter-spacing="1">
    MEASURING KEYBOARD INPUT LATENCY
  </text>
  <text x="400" y="365" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="12" font-weight="500" fill="url(#neon-cyan)" letter-spacing="0.5">
    HOW POLLING RATE AND SWITCH TYPE REDUCE TYPING DELAYS
  </text>
</svg>
