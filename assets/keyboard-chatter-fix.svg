<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#12162b"/>
      <stop offset="100%" stop-color="#05060b"/>
    </radialGradient>
    
    <!-- Neon Cyan -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Neon Pink -->
    <linearGradient id="neon-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#aa00ff"/>
    </linearGradient>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- Circuit traces in background -->
  <g opacity="0.15" stroke="url(#neon-cyan)" stroke-width="2" fill="none">
    <path d="M 50,225 L 300,225 L 350,175 L 550,175 L 600,225 L 750,225" />
    <path d="M 150,100 L 250,100 L 300,150 L 300,300" />
    <path d="M 650,350 L 550,350 L 500,300 L 500,150" />
    <circle cx="300" cy="300" r="5" fill="#00f0ff"/>
    <circle cx="500" cy="150" r="5" fill="#00f0ff"/>
    <circle cx="150" cy="100" r="5" fill="#00f0ff"/>
    <circle cx="750" cy="225" r="5" fill="#00f0ff"/>
  </g>

  <!-- Centered Graphic: Clean/Repair Concept -->
  <g transform="translate(250, 60)">
    <!-- Shield Outline -->
    <path d="M 30,50 L 150,10 L 270,50 L 270,150 Q 270,250 150,290 Q 30,250 30,150 Z" fill="rgba(18, 22, 41, 0.8)" stroke="url(#neon-cyan)" stroke-width="3" filter="url(#glow-cyan)"/>
    
    <!-- Broken Key Signal (Chatter Signal) -->
    <path d="M 80,120 L 130,120 L 110,150 L 160,150 L 100,220 L 120,165 L 80,165 Z" fill="url(#neon-pink)" filter="url(#glow-pink)"/>

    <!-- Diagnostic Rings (Target) -->
    <circle cx="150" cy="150" r="70" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="150" cy="150" r="90" fill="none" stroke="rgba(0, 240, 255, 0.1)" stroke-width="1"/>

    <!-- Keycap Icon inside -->
    <rect x="110" y="70" width="80" height="50" rx="10" fill="#0a0b10" stroke="#fff" stroke-width="2"/>
    <text x="150" y="102" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="24" fill="#fff">
      A
    </text>
  </g>

  <!-- Wrench & Screwdriver Crossed Icons (Conceptual Repair) -->
  <g transform="translate(100, 280)" filter="url(#glow-cyan)">
    <circle cx="40" cy="40" r="30" fill="rgba(0, 240, 255, 0.1)" stroke="url(#neon-cyan)" stroke-width="2"/>
    <!-- Gear icon -->
    <path d="M 40,25 L 40,30 M 40,50 L 40,55 M 25,40 L 30,40 M 50,40 L 55,40 M 29,29 L 33,33 M 47,47 L 51,51 M 29,51 L 33,47 M 47,29 L 51,33" stroke="url(#neon-cyan)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="40" cy="40" r="6" fill="none" stroke="url(#neon-cyan)" stroke-width="3"/>
  </g>

  <g transform="translate(640, 280)" filter="url(#glow-pink)">
    <circle cx="40" cy="40" r="30" fill="rgba(255, 0, 127, 0.1)" stroke="url(#neon-pink)" stroke-width="2"/>
    <!-- Checkmark icon -->
    <path d="M 28,40 L 36,48 L 54,30" fill="none" stroke="url(#neon-pink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text Labels -->
  <text x="400" y="380" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="26" font-weight="700" fill="#fff" letter-spacing="1">
    KEYBOARD CHATTER &amp; DOUBLE-CLICK FIX
  </text>
  <text x="400" y="410" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="14" font-weight="500" fill="url(#neon-cyan)" letter-spacing="0.5">
    DIAGNOSTICS • CLEANING • DE-BOUNCING SOFTWARE
  </text>
</svg>
